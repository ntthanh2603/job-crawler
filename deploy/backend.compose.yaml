# Backend ở một (hoặc nhiều) máy ứng dụng, Postgres + Redis ở máy riêng / dịch vụ quản lý.
#
#   docker compose -f deploy/backend.compose.yaml --env-file deploy/backend.env up -d
#
# backend.env (ví dụ, đủ biến ở backend/.env.example):
#   DATABASE_URL=postgresql+asyncpg://jobcrawler:***@db.internal:6432/jobcrawler   # qua PgBouncer
#   REDIS_URL=redis://redis.internal:6379/0
#   GATEWAY_TOKEN=<chuỗi ngẫu nhiên dài>
#   UI_PASSWORD=<mật khẩu giao diện>
#   RUNNER_POLL_REPLICAS=6
#   RUNNER_BUILD_REPLICAS=6
#
# Chạy migration một lần mỗi lần nâng cấp (service `migrate`, tự thoát). Trên máy ứng dụng thứ
# hai trở đi chỉ cần các runner: `... up -d runner-poll runner-build`. `scheduler` chạy ở hai máy
# cho dự phòng (chỉ một bản giữ khoá làm việc); `web` (giao diện + /api) / `gateway` để sau load
# balancer. Image: `docker build --build-context proto=proto -t jobcrawler-backend backend`,
# `docker build -t jobcrawler-web frontend` (từ gốc repo) rồi đẩy lên registry.
name: jobcrawler-backend

# Log của container xoay vòng (mặc định json-file không giới hạn).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-backend: &backend
  image: ${BACKEND_IMAGE:-jobcrawler-backend:latest}
  env_file:
    - path: backend.env
      required: false
  environment:
    LOG_FORMAT: ${LOG_FORMAT:-json}
  init: true
  restart: unless-stopped
  logging: *logging

services:
  migrate:
    <<: *backend
    command: ["jobcrawler", "db", "upgrade"]
    restart: "no"

  # API chỉ nhận từ `web` trên cùng máy (không mở cổng ra ngoài).
  api:
    <<: *backend
    command: ["jobcrawler", "api", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Tin X-Forwarded-For của nginx (`web`) để chặn đoán mật khẩu theo IP thật.
      FORWARDED_ALLOW_IPS: "*"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Giao diện (nginx) + chuyển /api tới `api`; đặt sau load balancer / TLS.
  web:
    image: ${WEB_IMAGE:-jobcrawler-web:latest}
    environment:
      API_UPSTREAM: http://api:8000
    ports:
      - "${WEB_PUBLISH:-127.0.0.1:8000}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  gateway:
    <<: *backend
    command: ["jobcrawler", "gateway"]
    ports:
      - "${GATEWAY_PUBLISH:-0.0.0.0:50051}:50051"
    # grpc.health.v1 qua `jobcrawler gateway-health` (TLS theo GATEWAY_TLS_CERT/KEY; chứng chỉ không
    # có tên 127.0.0.1 thì thêm `--server-name`, CA công khai thì `--ca-cert`).
    healthcheck:
      test: ["CMD", "jobcrawler", "gateway-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s

  scheduler:
    <<: *backend
    command: ["jobcrawler", "scheduler"]

  runner-poll:
    <<: *backend
    command: ["jobcrawler", "runner", "--role", "poll"]
    deploy:
      replicas: ${RUNNER_POLL_REPLICAS:-2}

  runner-build:
    <<: *backend
    command: ["jobcrawler", "runner", "--role", "build"]
    deploy:
      replicas: ${RUNNER_BUILD_REPLICAS:-2}

  runner-boards:
    <<: *backend
    command: ["jobcrawler", "runner", "--role", "boards"]
    deploy:
      replicas: ${RUNNER_BOARDS_REPLICAS:-1}
