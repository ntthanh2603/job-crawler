name: jobcrawler

# Một máy chạy đủ hệ thống (dev / quy mô nhỏ). Triển khai nhiều máy và quy mô 10.000 doanh
# nghiệp: docs/DEPLOY.md (worker ở máy khác dùng deploy/worker.compose.yaml).
#
# Mỗi service build từ thư mục của nó và đọc `.env` của nó: backend/ (api, gateway, scheduler,
# runner, migrate — một image), worker/, frontend/ (image `web`: nginx phục vụ giao diện và chuyển
# /api tới `api`). proto/ là thư viện hợp đồng gRPC, vào image backend / worker qua build context
# tên `proto`. `.env` ở gốc chỉ cho biến của compose (cổng, số bản, tài khoản Postgres).

# Log của container xoay vòng (mặc định json-file không giới hạn, đầy đĩa sau vài tuần).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-backend: &backend
  image: jobcrawler-backend:latest
  env_file:
    - path: backend/.env
      required: false
  environment: &backend_env
    # Ghi đè URL trong backend/.env (vốn trỏ 127.0.0.1 cho CLI trên host) bằng hostname nội bộ.
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobcrawler}:${POSTGRES_PASSWORD:-jobcrawler}@postgres:5432/${POSTGRES_DB:-jobcrawler}
    REDIS_URL: redis://redis:6379/0
  depends_on: &backend_deps
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  init: true
  restart: unless-stopped
  logging: *logging

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobcrawler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobcrawler}
      POSTGRES_DB: ${POSTGRES_DB:-jobcrawler}
    # Chỉ mở ở 127.0.0.1 (IPv4) cho CLI / test trên máy host; không mở ra mạng.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    # /dev/shm mặc định của Docker (64 MB) không đủ cho truy vấn / VACUUM song song khi bảng lớn.
    shm_size: 512mb
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Chỉ chạy khi volume còn trống: tạo thêm DB `jobcrawler_test` cho test tích hợp.
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    # Hàng đợi (Redis Streams) + rate limit + cache: AOF mỗi giây, tự viết lại khi phình.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    # Redis không đặt mật khẩu: chỉ mở ở 127.0.0.1.
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  # Chạy một lần `jobcrawler db upgrade` để các process không khởi động trên schema cũ.
  migrate:
    <<: *backend
    build:
      context: backend
      additional_contexts:
        proto: proto
    command: ["jobcrawler", "db", "upgrade"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # API JSON (/api/...). Không mở ra host: trình duyệt đi qua `web`. Đặt UI_PASSWORD trong
  # backend/.env nếu mở `web` ra ngoài.
  api:
    <<: *backend
    command: ["jobcrawler", "api", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *backend_env
      # Chỉ `web` (nginx) gọi tới được api: tin X-Forwarded-For của nó để chặn đoán mật khẩu theo
      # IP thật của người dùng.
      FORWARDED_ALLOW_IPS: "*"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Giao diện React (frontend/) trên nginx không root; /api/ chuyển tới `api` (giữ Host cho kiểm
  # tra chống CSRF). Chỉ mở ở 127.0.0.1.
  web:
    image: jobcrawler-web:latest
    build:
      context: frontend
    environment:
      API_UPSTREAM: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  # Gateway gRPC cho worker lấy trang. Worker ở máy khác nối vào GATEWAY_PUBLISH (mặc định chỉ
  # 127.0.0.1); mở ra ngoài thì đặt GATEWAY_TOKEN (và TLS, xem docs/DEPLOY.md).
  gateway:
    <<: *backend
    command: ["jobcrawler", "gateway"]
    ports:
      - "${GATEWAY_PUBLISH:-127.0.0.1:50051}:50051"
    # grpc.health.v1 qua `jobcrawler gateway-health` (TLS theo GATEWAY_TLS_CERT/KEY); worker chờ
    # SERVING mới khởi động.
    healthcheck:
      test: ["CMD", "jobcrawler", "gateway-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # Xếp lịch build đêm / poll ngày. Nhiều replica được (một replica giữ khoá làm việc).
  scheduler:
    <<: *backend
    command: ["jobcrawler", "scheduler"]

  # Runner poll: lượt nhẹ theo bộ khung, cần nhanh (mỗi replica RUNNER_POLL_CONCURRENCY lượt).
  runner-poll:
    <<: *backend
    command: ["jobcrawler", "runner", "--role", "poll"]
    deploy:
      replicas: ${RUNNER_POLL_REPLICAS:-2}

  # Runner build: lượt đủ (đêm, khi poll lỗi, doanh nghiệp mới) + cron bảo trì / số liệu.
  runner-build:
    <<: *backend
    command: ["jobcrawler", "runner", "--role", "build"]
    deploy:
      replicas: ${RUNNER_BUILD_REPLICAS:-2}

  # Runner trang tuyển dụng: index đủ ban đêm, index đuôi mỗi 2 phút ban ngày.
  runner-boards:
    <<: *backend
    command: ["jobcrawler", "runner", "--role", "boards"]
    deploy:
      replicas: ${RUNNER_BOARDS_REPLICAS:-1}

  # Worker lấy trang (curl_cffi + Chromium). Cấu hình ở worker/.env; proxy riêng của worker:
  # worker/config/worker-proxies.txt hoặc WORKER_PROXIES trong worker/.env.
  worker:
    image: jobcrawler-worker:latest
    build:
      context: worker
      additional_contexts:
        proto: proto
    command: ["jobworker", "run"]
    env_file:
      - path: worker/.env
        required: false
    environment:
      GATEWAY_ADDR: gateway:50051
      WORKER_PROXIES_FILE: /app/config/worker-proxies.txt
    volumes:
      - ./worker/config:/app/config:ro
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    init: true
    shm_size: 1gb
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  redisdata:
