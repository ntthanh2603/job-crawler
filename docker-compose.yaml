name: jobcrawler

# Năm container: postgres, redis, backend, frontend, worker.
#
# Mỗi service build từ thư mục của nó và đọc `.env` của nó: backend/ (`jobcrawler serve`: migration
# rồi API, gateway gRPC, scheduler, runner trong một container), worker/ (lấy trang), frontend/
# (nginx phục vụ giao diện, chuyển /api tới `backend`). proto/ là thư viện hợp đồng gRPC, vào image
# backend / worker qua build context tên `proto`. `.env` ở gốc chỉ cho biến của compose (cổng, số
# worker, tài khoản Postgres, image).
#
# Worker ở máy khác: trên máy đó `docker compose up -d --no-deps worker` với WORKER_GATEWAY_ADDR
# trong `.env` gốc (docs/DEPLOY.md).

# Log của container xoay vòng (mặc định json-file không giới hạn, đầy đĩa sau vài tuần).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobcrawler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobcrawler}
      POSTGRES_DB: ${POSTGRES_DB:-jobcrawler}
    # Chỉ mở ở 127.0.0.1 (IPv4) cho CLI / test trên máy host; không mở ra mạng.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    # /dev/shm mặc định của Docker (64 MB) không đủ cho truy vấn / VACUUM song song khi bảng lớn.
    shm_size: 512mb
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Chỉ chạy khi volume còn trống: tạo thêm DB `jobcrawler_test` cho test tích hợp.
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  # Hàng đợi (Redis Streams), khoá, rate limit, cài đặt và cache. AOF mỗi giây; đầy bộ nhớ thì lệnh
  # ghi báo lỗi chứ không xoá việc trong hàng đợi (cache có TTL nên tự dọn).
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    # Redis không đặt mật khẩu: chỉ mở ở 127.0.0.1.
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  # `jobcrawler serve`: migration rồi bốn process — API JSON (:8000, chỉ trong mạng compose, trình
  # duyệt đi qua `frontend`), gateway gRPC cho worker (:50051), scheduler, runner (build / poll /
  # trang tuyển dụng). Một process thoát hoặc treo (watchdog) thì container thoát và Docker dựng
  # lại. Cấu hình ở backend/.env; đặt UI_PASSWORD nếu mở giao diện ra ngoài.
  backend:
    image: ${REGISTRY:-}jobcrawler-backend:${IMAGE_TAG:-latest}
    build:
      context: backend
      additional_contexts:
        proto: proto
    command: ["jobcrawler", "serve", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: backend/.env
        required: false
    environment:
      # Ghi đè URL trong backend/.env (vốn trỏ 127.0.0.1 cho CLI trên host) bằng hostname nội bộ.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobcrawler}:${POSTGRES_PASSWORD:-jobcrawler}@postgres:5432/${POSTGRES_DB:-jobcrawler}
      REDIS_URL: redis://redis:6379/0
      CACHE_REDIS_URL: ""
      # Chỉ `frontend` (nginx) gọi tới được API: tin X-Forwarded-For của nó để chặn đoán mật khẩu
      # theo IP thật của người dùng.
      FORWARDED_ALLOW_IPS: "*"
    # Worker ở máy khác nối vào đây; mở ra ngoài thì đặt GATEWAY_TOKEN (và TLS, docs/DEPLOY.md).
    ports:
      - "${GATEWAY_PUBLISH:-127.0.0.1:50051}:50051"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # API trả lời, gateway SERVING, scheduler và runner còn heartbeat mới trên Redis.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"
          && jobcrawler gateway-health && jobcrawler health scheduler runner
      interval: 30s
      timeout: 20s
      retries: 3
      # Migration chạy trước khi các process khởi động.
      start_period: 120s
      start_interval: 5s
    # SIGTERM: các process làm nốt việc đang chạy, tối đa 25 giây.
    stop_grace_period: 30s
    init: true
    restart: unless-stopped
    logging: *logging

  # Giao diện React trên nginx không root; /api/ chuyển tới `backend` (giữ Host cho kiểm tra chống
  # CSRF). Chỉ mở ở 127.0.0.1.
  frontend:
    image: ${REGISTRY:-}jobcrawler-frontend:${IMAGE_TAG:-latest}
    build:
      context: frontend
    environment:
      API_UPSTREAM: http://backend:8000
      # Có load balancer / reverse proxy đứng trước: CIDR của nó (tin X-Forwarded-For từ đó).
      REAL_IP_FROM: ${REAL_IP_FROM:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  # Worker lấy trang (curl_cffi + Chromium). Cấu hình ở worker/.env; proxy riêng của worker:
  # worker/config/worker-proxies.txt hoặc WORKER_PROXIES trong worker/.env.
  worker:
    image: ${REGISTRY:-}jobcrawler-worker:${IMAGE_TAG:-latest}
    build:
      context: worker
      additional_contexts:
        proto: proto
    command: ["jobworker", "run"]
    env_file:
      - path: worker/.env
        required: false
    environment:
      GATEWAY_ADDR: ${WORKER_GATEWAY_ADDR:-backend:50051}
      WORKER_PROXIES_FILE: /app/config/worker-proxies.txt
    volumes:
      - ./worker/config:/app/config:ro
    depends_on:
      backend:
        condition: service_healthy
    # `jobworker health` đọc file trạng thái worker ghi: treo, hoặc mất gateway quá 5 phút →
    # unhealthy; vòng lặp kẹt thì watchdog cho process thoát và Docker dựng lại.
    healthcheck:
      test: ["CMD", "jobworker", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    # SIGTERM: worker thôi nhận việc và làm nốt tối đa WORKER_SHUTDOWN_GRACE_SECONDS (30) giây;
    # mặc định Docker chỉ chờ 10 giây rồi SIGKILL.
    stop_grace_period: 40s
    init: true
    shm_size: 1gb
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  redisdata:
