# Workspace uv: một venv chung (.venv) cho ba gói.
#   backend/  jobcrawler        API, gRPC gateway, runner (build/poll), scheduler, DB, LLM
#   worker/   jobworker         lấy trang (curl_cffi + Chromium, proxy tại worker), gọi gateway qua gRPC
#   proto/    jobcrawler-proto  hợp đồng gRPC chung (crawl.proto + mã sinh sẵn)
# Cài đặt: `uv sync` (cả ba gói, kèm công cụ dev). Image Docker cài riêng từng gói
# (`uv sync --package jobcrawler` / `--package jobworker`).

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "worker", "proto"]

[tool.uv.sources]
jobcrawler = { workspace = true }
jobworker = { workspace = true }
jobcrawler-proto = { workspace = true }

[dependency-groups]
dev = [
    "jobcrawler",
    "jobworker",
    "jobcrawler-proto",
    # Sinh lại mã từ proto/jcproto/v1/crawl.proto (`python scripts/gen_proto.py`).
    "grpcio-tools>=1.84.0",
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["proto/jcproto/v1/*_pb2*.py", "proto/jcproto/v1/*_pb2*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "PT", "RUF"]
# RUF001-003: chuỗi/comment tiếng Việt có ký tự mà ruff coi là "ambiguous unicode".
# ASYNC109: `timeout` được chuyển xuống curl_cffi/Playwright/openai để chính chúng áp dụng.
ignore = ["RUF001", "RUF002", "RUF003", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# Migration sinh bởi Alembic có CHECK constraint dài trên một dòng.
"backend/jobcrawler/db/alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["jobcrawler", "jobworker", "jcproto"]

[tool.pyright]
include = ["backend", "worker", "proto", "scripts"]
exclude = ["**/node_modules", "**/__pycache__", "**/dist", "proto/jcproto/v1/*_pb2_grpc.py"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
# Test của worker không là package (không có __init__.py) để không trùng tên `tests` với backend.
testpaths = ["backend/tests", "worker/tests", "proto/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: cần Postgres + Redis thật (đặt TEST_DATABASE_URL, xem .env.example)",
    "browser: cần Chromium của Playwright (`playwright install chromium`)",
]
# Giống bộ lọc trong jobcrawler.resources (pytest reset bộ lọc đặt lúc import).
filterwarnings = ['ignore:\s*Proactor event loop:curl_cffi.utils.CurlCffiWarning']
