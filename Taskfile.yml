# go-task v3 (https://taskfile.dev): `task --list` để xem các lệnh. Chạy được trên Windows (Task
# dùng trình thông dịch shell riêng; không dùng cú pháp chỉ có ở bash).
#
# Mỗi service có Taskfile riêng trong thư mục của nó và chạy độc lập (lockfile, công cụ, `.env`
# riêng); file này chỉ gom lại: `task backend:test`, `task worker:dev`, `task frontend:build`,
# `task proto:gen`… và các lệnh chạy trên mọi service (`task check`).
version: "3"

includes:
  proto:
    taskfile: ./proto/Taskfile.yml
    dir: ./proto
  backend:
    taskfile: ./backend/Taskfile.yml
    dir: ./backend
  worker:
    taskfile: ./worker/Taskfile.yml
    dir: ./worker
  frontend:
    taskfile: ./frontend/Taskfile.yml
    dir: ./frontend

tasks:
  default:
    cmds:
      - task --list
    silent: true

  # --- cài đặt ---------------------------------------------------------------------------------

  setup:
    desc: Cài dependency của mọi service (uv cho proto / backend / worker, npm cho frontend), tạo các file .env
    preconditions:
      - sh: uv --version
        msg: "Cần uv: https://docs.astral.sh/uv/"
      - sh: npm --version
        msg: "Cần Node.js + npm (bản trong frontend/.nvmrc)"
    cmds:
      - task: proto:setup
      - task: backend:setup
      - task: worker:setup
      - task: frontend:setup
      - task: env

  env:
    desc: Tạo backend/.env và worker/.env từ file .env.example tương ứng (giữ nguyên file đã có)
    cmds:
      - for: ["backend", "worker"]
        cmd: uv run --no-project python -c "import pathlib, shutil; d = pathlib.Path('{{.ITEM}}'); p = d / '.env'; p.exists() or shutil.copyfile(d / '.env.example', p)"

  # --- docker compose --------------------------------------------------------------------------

  up:
    desc: Build image và chạy 5 container (postgres, redis, backend, frontend, worker)
    cmds:
      - docker compose up -d --build

  infra:
    desc: Chỉ Postgres + Redis (chạy service trên máy / test tích hợp), chờ healthy
    cmds:
      - docker compose up -d --wait postgres redis

  down:
    desc: Dừng stack (giữ volume dữ liệu)
    cmds:
      - docker compose down

  # --- phát hành ------------------------------------------------------------------------------

  release:
    desc: "Phát hành: tạo tag vX.Y.Z (annotated) trên main và đẩy lên origin; CI build + đẩy image lên GHCR. Dùng: task release VERSION=1.2.0"
    requires:
      vars: [VERSION]
    preconditions:
      - sh: '{{if regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+$" .VERSION}}true{{else}}false{{end}}'
        msg: "VERSION phải có dạng X.Y.Z (vd. 1.2.0), không có tiền tố v"
      - sh: test -z "$(git status --porcelain)"
        msg: "Cây làm việc còn thay đổi chưa commit (git status)"
      - sh: test "$(git rev-parse --abbrev-ref HEAD)" = main
        msg: "Chỉ phát hành từ nhánh main"
      - sh: git fetch --quiet --tags origin main && test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
        msg: "main chưa khớp origin/main: pull / push trước"
      - sh: '! git rev-parse --quiet --verify "refs/tags/v{{.VERSION}}"'
        msg: "Tag v{{.VERSION}} đã có"
    cmds:
      - git tag -a "v{{.VERSION}}" -m "jobcrawler v{{.VERSION}}"
      - git push origin "v{{.VERSION}}"

  # --- chạy trên mọi service ------------------------------------------------------------------

  fmt:
    desc: Định dạng + sửa lỗi lint tự sửa được (ruff) ở proto, backend, worker
    cmds:
      - task: proto:fmt
      - task: backend:fmt
      - task: worker:fmt

  lint:
    desc: Lint mọi service (ruff ở proto / backend / worker, tsc ở frontend)
    cmds:
      - task: proto:lint
      - task: backend:lint
      - task: worker:lint
      - task: frontend:typecheck

  typecheck:
    desc: pyright ở proto / backend / worker, tsc ở frontend
    cmds:
      - task: proto:typecheck
      - task: backend:typecheck
      - task: worker:typecheck
      - task: frontend:typecheck

  test:
    desc: "Test mọi service (test tích hợp của backend cần Postgres + Redis + TEST_DATABASE_URL kết thúc `_test`)"
    cmds:
      - task: proto:test
      - task: backend:test
      - task: worker:test
      - task: frontend:test

  check:
    desc: Mọi thứ CI chạy, từng service một — chạy trước khi commit
    cmds:
      - task: proto:check
      - task: backend:check
      - task: worker:check
      - task: frontend:check

  # --- hợp đồng API backend → frontend --------------------------------------------------------

  api:
    desc: Ghi lại backend/openapi.json từ mô hình trả về của API rồi sinh lại client của frontend (orval)
    cmds:
      - task: backend:api
      - task: frontend:gen-api

  api:check:
    desc: Kiểm tra backend/openapi.json và client sinh ở frontend đã khớp
    cmds:
      - task: backend:api:check
      - task: frontend:gen-api:check
