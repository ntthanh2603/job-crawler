name: Audit

# Kiểm lỗ hổng đã công bố trong dependency (chỉ báo, không mở PR / nhánh).
on:
  schedule:
    - cron: "17 2 * * 1" # thứ Hai 02:17 UTC (09:17 giờ Việt Nam)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python dependencies (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"

      # Chỉ dependency chạy thật (không dev, không gói của workspace) theo đúng bản trong uv.lock.
      - name: Export locked requirements
        run: uv export --frozen --no-dev --no-emit-workspace --no-hashes -o requirements.txt

      # File export đã đủ cây dependency đã ghim: không để pip resolve / build lại.
      - name: pip-audit
        run: uvx pip-audit -r requirements.txt --disable-pip --no-deps

  frontend:
    name: Frontend dependencies (npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
