name: CI

# Commit thẳng lên main (không có nhánh / PR): chạy mỗi lần push main, hoặc bấm tay.
# Mỗi service một job, chạy trong thư mục của nó với lockfile / công cụ riêng (như `task <svc>:check`).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Push mới huỷ lượt đang chạy của commit cũ hơn trên cùng nhánh.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "1"
  UV_FROZEN: "1"

jobs:
  proto:
    name: proto (ruff, pyright, mã sinh, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: proto
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          # Cùng bản uv với các Dockerfile.
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: proto/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - name: Mã sinh khớp crawl.proto
        run: uv run python scripts/gen.py --check
      - run: uv run pytest -q

  backend:
    name: backend (ruff, pyright, OpenAPI, pytest + Postgres/Redis)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      # Cùng image với docker-compose.yaml.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobcrawler
          POSTGRES_PASSWORD: jobcrawler
          POSTGRES_DB: jobcrawler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobcrawler -d jobcrawler"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # DB của app và DB test phải khác nhau; test tích hợp xoá + dựng lại schema của DB `*_test`.
      DATABASE_URL: postgresql+asyncpg://jobcrawler:jobcrawler@127.0.0.1:5432/jobcrawler
      TEST_DATABASE_URL: postgresql+asyncpg://jobcrawler:jobcrawler@127.0.0.1:5432/jobcrawler_test
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      # Như deploy/postgres/init/01-test-db.sql của compose (service container không mount được
      # file trong repo). Extension (pg_trgm, unaccent) do migration tạo.
      - name: Tạo DB test
        run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -U jobcrawler -d jobcrawler -c "CREATE DATABASE jobcrawler_test"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - name: openapi.json khớp mô hình API
        run: uv run python scripts/export_openapi.py --check
      - run: uv run pytest -q

  worker:
    name: worker (ruff, pyright, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      # Test có marker `browser` tự bỏ qua khi không có Chromium của Playwright.
      - run: uv run pytest -q

  frontend:
    name: frontend (typecheck, client sinh từ OpenAPI, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Client sinh từ ../backend/openapi.json đã khớp
        run: npm run gen:api:check --if-present
      - run: npm run test:run
      - run: npm run build

  docker:
    name: image ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mỗi image build từ thư mục service của nó; backend / worker lấy thêm proto/ làm
          # build context tên `proto` (như `additional_contexts` trong docker-compose.yaml).
          - image: backend
            context: backend
            contexts: proto=proto
          - image: worker
            context: worker
            contexts: proto=proto
          - image: web
            context: frontend
            contexts: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      # Chỉ build để bắt lỗi Dockerfile / lockfile; không đẩy image đi đâu.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          build-contexts: ${{ matrix.contexts }}
          push: false
          tags: jobcrawler-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
