name: CI

# Pull request: chỉ kiểm tra — format, lint, typecheck, mã sinh (proto, OpenAPI), test, build thử ba
# image (không đẩy). Push lên main (merge PR hoặc commit thẳng) và tag vX.Y.Z (`task release`): kiểm
# tra như trên rồi build và đẩy ba image lên GHCR (ghcr.io/<owner>/jobcrawler-{backend,worker,frontend}).
# Mỗi service một job, chạy trong thư mục của nó với lockfile / công cụ riêng (như `task <svc>:check`).
# Test E2E trên stack compose chạy ở máy (`task frontend:e2e`), không chạy ở CI.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR: lượt mới huỷ lượt cũ. main và tag: không huỷ (commit nào cũng cần image).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: "1"
  UV_FROZEN: "1"

jobs:
  proto:
    name: proto (ruff, pyright, mã sinh, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: proto
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          # Cùng bản uv với các Dockerfile.
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: proto/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - name: Mã sinh khớp crawl.proto
        run: uv run python scripts/gen.py --check
      - run: uv run pytest -q

  proto-breaking:
    name: proto (buf lint, breaking so với commit trước)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Cần commit mốc trong .git cục bộ (buf so sánh với nó, không cần mạng / token).
          fetch-depth: 0
      # Mốc so sánh: PR → commit gốc của nhánh đích; push → commit ngay trước lượt push. Không có
      # (bấm tay, tag mới) thì commit cha của HEAD.
      - name: Mốc so sánh
        id: base
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "sha=$BEFORE" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
          fi
      - uses: bufbuild/buf-action@v1
        with:
          # Cùng bản với lệnh docker trong proto/buf.yaml.
          version: 1.73.0
          input: proto
          lint: true
          format: false
          breaking: true
          breaking_against: .git#ref=${{ steps.base.outputs.sha }},subdir=proto
          # Không có Buf Schema Registry: không push / archive module.
          push: false
          archive: false
          pr_comment: false

  backend:
    name: backend (ruff, pyright, OpenAPI, pytest + Postgres/Redis)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      # Cùng image với docker-compose.yaml.
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: jobcrawler
          POSTGRES_PASSWORD: jobcrawler
          POSTGRES_DB: jobcrawler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobcrawler -d jobcrawler"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # DB của app và DB test phải khác nhau; test tích hợp xoá + dựng lại schema của DB `*_test`.
      DATABASE_URL: postgresql+asyncpg://jobcrawler:jobcrawler@127.0.0.1:5432/jobcrawler
      TEST_DATABASE_URL: postgresql+asyncpg://jobcrawler:jobcrawler@127.0.0.1:5432/jobcrawler_test
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      # Như deploy/postgres/init/01-test-db.sql của compose (service container không mount được
      # file trong repo). Extension (pg_trgm, unaccent) do migration tạo.
      - name: Tạo DB test
        run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -U jobcrawler -d jobcrawler -c "CREATE DATABASE jobcrawler_test"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - name: openapi.json khớp mô hình API
        run: uv run python scripts/export_openapi.py --check
      - run: uv run pytest -q

  worker:
    name: worker (ruff, pyright, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      # Test có marker `browser` tự bỏ qua khi không có Chromium của Playwright.
      - run: uv run pytest -q

  frontend:
    name: frontend (typecheck, client sinh từ OpenAPI, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Client sinh từ ../backend/openapi.json đã khớp
        run: npm run gen:api:check --if-present
      - run: npm run test:run
      - run: npm run build


  images:
    name: image ${{ matrix.image }}
    # Chỉ build / đẩy image khi mọi kiểm tra đã xanh.
    needs: [proto, proto-breaking, backend, worker, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # Tải SARIF của Trivy lên Code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mỗi image build từ thư mục service của nó; backend / worker lấy thêm proto/ làm
          # build context tên `proto` (như `additional_contexts` trong docker-compose.yaml).
          - image: backend
            context: backend
            contexts: proto=proto
            description: jobcrawler backend (API, gateway gRPC, scheduler, runner in one container)
          - image: worker
            context: worker
            contexts: proto=proto
            description: jobcrawler fetch worker (curl_cffi + Chromium)
          - image: frontend
            context: frontend
            contexts: ""
            description: jobcrawler web UI (nginx, proxies /api to the backend)
    env:
      # Đẩy lên GHCR khi push main hoặc tag vX.Y.Z; PR / bấm tay trên nhánh khác: chỉ build thử.
      PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Tên image trên GHCR phải viết thường.
      - name: Tên image
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: echo "ref=ghcr.io/${OWNER,,}/jobcrawler-${IMAGE}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main → `main` + `sha-<7 ký tự>`; tag v1.4.0 → `1.4.0`, `1.4`, `latest`.
      - name: Tag và nhãn OCI
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.ref }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=jobcrawler-${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build${{ env.PUBLISH == 'true' && ' + push' || '' }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          build-contexts: ${{ matrix.contexts }}
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # Quét image vừa đẩy: lỗ hổng CRITICAL/HIGH đã có bản vá → tab Security (SARIF) và job đỏ.
      # trivy-action ghim theo commit (v0.36.0): các tag cũ của action từng bị chiếm (03/2026).
      - name: Trivy (SARIF)
        if: env.PUBLISH == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.name.outputs.ref }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "0"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      # Repo riêng tư cần GitHub Advanced Security (Code scanning) để nhận SARIF; không có thì bước
      # này lỗi nhưng bước quét dạng bảng bên dưới vẫn chạy và in kết quả vào log.
      - name: Tải kết quả lên Code scanning
        if: always() && env.PUBLISH == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      - name: Trivy (chặn khi có lỗ hổng đã có bản vá)
        if: env.PUBLISH == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.name.outputs.ref }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          # Bước trên đã cài Trivy và tải DB lỗ hổng.
          skip-setup-trivy: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_SKIP_DB_UPDATE: "true"
