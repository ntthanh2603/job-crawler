name: CI

# Commit thẳng lên main (không có nhánh / PR): chạy mỗi lần push main, hoặc bấm tay.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Push mới huỷ lượt đang chạy của commit cũ hơn trên cùng nhánh.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff, pyright, proto, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # Cùng image với docker-compose.yaml.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobcrawler
          POSTGRES_PASSWORD: jobcrawler
          POSTGRES_DB: jobcrawler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobcrawler -d jobcrawler"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: "1"
      UV_FROZEN: "1"
      # DB của app và DB test phải khác nhau; test tích hợp xoá + dựng lại schema của DB `*_test`.
      DATABASE_URL: postgresql+asyncpg://jobcrawler:jobcrawler@127.0.0.1:5432/jobcrawler
      TEST_DATABASE_URL: postgresql+asyncpg://jobcrawler:jobcrawler@127.0.0.1:5432/jobcrawler_test
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          # Cùng bản uv với backend/Dockerfile, worker/Dockerfile.
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --frozen

      # Như docker/postgres/init/01-test-db.sql của compose (service container không mount được
      # file trong repo). Extension (pg_trgm, unaccent) do migration tạo.
      - name: Create test database
        run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -U jobcrawler -d jobcrawler -c "CREATE DATABASE jobcrawler_test"

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Proto up to date
        run: uv run python scripts/gen_proto.py --check

      # Test có marker `browser` tự bỏ qua khi không có Chromium của Playwright.
      - name: Pytest
        run: uv run pytest -q

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # Cùng major với stage `ui` của backend/Dockerfile.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run --if-present

      - name: Build
        run: npm run build

  docker:
    name: Docker image (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: backend/Dockerfile
          - image: worker
            dockerfile: worker/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      # Chỉ build để bắt lỗi Dockerfile / lockfile; không đẩy image đi đâu.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: jobcrawler-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
